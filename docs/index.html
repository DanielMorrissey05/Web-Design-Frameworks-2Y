<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>
    <link rel="stylesheet" href="assets/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>

<body>

    <!-- D-Fly navbar -->
    <header class="bg-blue">
        <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 p-4">

            <a href="index.html" 
                class="text-logo font-bold text-ink-deep
                    focus-visible:outline-2
                    focus-visible:outline-offset-4
                    focus-visible:outline-ink-deep">
                D-Fly
            </a>

            <div class="flex flex-wrap items-center gap-4 text-nav">
                <a href="index.html" 
                    class="focus-visible:outline-2 focus-visible:outline-offset-4">
                    Home
                </a>

                <a href="index.html" 
                    class="focus-visible:outline-2 focus-visible:outline-offset-4">

                </a>

                <a href="index.html" 
                    class="focus-visible:outline-2 focus-visible:outline-offset-4">

                </a>

    <main class="mx-auto max-w-7xl px-4 py-8 md:px-8  md:py-12">
        
        <section class="flex flex-col gap-6">

            <h1 class="max-w-3xl text-mobile-heading font-bold leading-tight md:text-desktop-heading">

            </p>

            <div>

                class ="rounded border-2 border-border bg-contrast
                px-8 py-4 text-button font-bold
                text-ink-deep
                focus-visible:outline-2
                focus-visible:outline-offset-4
                focus-visible:outline-ink-deep">
                Find Flights
                </button>
            </div>

        </section>

    <footer class="p-4">
        <div class="mx-auto max-w-5xl">
