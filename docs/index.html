<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>
    <link rel="stylesheet" href="assets/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>

<body>

    <!-- D-Fly navbar -->
    <header class="bg-blue">
        <nav
            aria-label="Main navigation"
            class="mx-auto flex w-full max-w-7xl flex-wrap items-center justify-between gap-5 px-5 py-6"
        >
            <a href="index.html" 
                class="flex items-center gap-2 font-bold text-on-dark no-underline text-3xl md:text-4xl focus-visible:outline-2 focus-visible:outline-offset-4"
                >
                D-Fly <span aria-hidden="true">✈</span>
            </a>

            <div class="flex flex-wrap items-center gap-x-6 gap-y-3 text-base font-semibold text-on-dark"
            >
                <a href="index.html" class="hover:text-button-hover-2">Home</a>
                <a href="index.html" class="hover:text-button-hover-2">About Us</a>
                <a href="index.html" class="hover:text-button-hover-2">Book</a>
                <a href="index.html" class="hover:text-button-hover-2">Manage</a>
                <a href="index.html" class="hover:text-button-hover-2">Travel Info</a>
                <a href="index.html" class="hover:text-button-hover-2">Explore</a>
                <a href="index.html" class="hover:text-button-hover-2">How It Works</a>

                <a
                    href="index.html"
                    class="flex items-center gap-2 rounded-md border-2 border-on-dark px-3 py-2 text-on-dark no-underline hover:bg-purple hover:border-on-light focus-visible:outline-2 focus-visible:outline-offset-4"
                >
                    Your Account
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="22"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                    <circle cx="12" cy="6" r="4"></circle>
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                    </svg>
                </a>

                <button
                type="button"
                class="flex items-center gap-2 rounded-md border-2 border-on-light bg-purple px-3 py-2 text-on-dark hover:bg-on-light focus-visible:outline-2 focus-visible:outline-offset-4"
                >
                Your Language ⌄
                </button>
            </div>
        </nav>
    </header>

    <!-- First Screen -->
    <main class="mx-auto max-w-7xl px-4 py-8 md:px-8 md:py-12">
        
        <section class="flex flex-col gap-6">
            <h1 class="max-w-64 text-mobile-heading font-bold leading-snug text-on-light md:max-w-md md:text-desktop-heading">
                In need of a fast and seamless flight booking?
                Find your dream holiday with us
            </h1>
        </section>

        <section
        aria-label="Search for flights"
            class="relative z-10 mx-auto -mt-12 max-w-7xl px-5 pb-8 md:-mt-20"
        >

        <div class="flex w-fit max-w-full overflow-hidden rounded-t-xl border border-button-border bg-page-2"></div>

        <button
            type="button"
            class="border-r border-button-border bg-page-2 px-5 py-3 font-bold text-ink-deep"
        >
            Flight ✈
        </button>

        <button 
            type="button"
            class="border-r border-button-border px-5 py-3 text-ink-deep"
        >
        Hotel
        </button>

        <button
            type="button"
            class="px-5 py-3 text-ink-deep"
        >
        Car
        </button>
    </div>
    </main>

    <footer class="p-4">
        <div class="mx-auto max-w-5xl">
            <p>My App</p>
        </div>
    </footer>

</body>
</html>
